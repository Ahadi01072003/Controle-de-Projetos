function vReplans() {
  const L = acts();
  if (!L.length) return emptyAll();
  const lv = live(L), rep = lv.filter(x => x.c.replan);
  const log = [];
  L.forEach(x => (x.a.replans || []).forEach((r, i) => log.push({ x, r, n: i + 1 })));
  log.sort((a, b) => String(b.r.em).localeCompare(String(a.r.em)));
  const desvMed = rep.length ? rep.reduce((s, x) => s + x.c.dFim, 0) / rep.length : 0;
  const worst = rep.slice().sort((a, b) => b.c.dFim - a.c.dFim)[0];
  const acum = rep.reduce((s, x) => s + Math.max(0, x.c.dFim), 0);
  const kpi = (i, lbl, icon, val, foot, c = 'var(--muted)') => `<div class="kpi rise" style="--i:${i};--c:${c}"><div class="lbl">${ic(icon)}${lbl}</div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;
  const kpis = `<div class="card rk">
    ${kpi(0, 'Replanejamentos registrados', 'rev', cnum('rlog', log.length), `em ${rep.length} ${rep.length === 1 ? 'atividade' : 'atividades'}`, 'var(--st-risk)')}
    ${kpi(1, 'Atividades replanejadas', 'lista', cnum('rpct', lv.length ? rep.length / lv.length * 100 : 0, 'pct'), `${rep.length} de ${lv.length} ativas`)}
    ${kpi(2, 'Deslocamento médio do fim', 'flag', rep.length ? cnum('rdm', desvMed, 'sd') : '—', 'vs. data original', desvMed > 0 ? stColor('atrasada') : 'var(--muted)')}
    ${kpi(3, 'Atraso acumulado nos prazos', 'cal', rep.length ? cnum('racc', acum, 'sdi') : '—', worst && worst.c.dFim > 0 ? `maior: ${esc(worst.a.codigo || '')} (${fdelta(worst.c.dFim)})` : 'soma dos deslocamentos', acum > 0 ? stColor('atrasada') : 'var(--muted)')}
  </div>`;
  if (!log.length && !rep.length) return `<div class="rgrid">${kpis}<div class="card empty rise"><svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${IC.rev}</svg><h3>Nenhum replanejamento até agora</h3><p>Quando uma data planejada for alterada, a mudança aparece aqui com o motivo e a variação em relação à data original.</p></div></div>`;
  const mc = {}; log.forEach(l => mc[l.r.motivo || 'outro'] = (mc[l.r.motivo || 'outro'] || 0) + 1);
  const mot = Object.entries(mc).sort((a, b) => b[1] - a[1]), mmax = Math.max(1, ...mot.map(m => m[1]));
  const motHTML = `<div class="card r-half rise" style="--i:4"><div class="card-h"><h2>Motivos dos replanejamentos</h2><span class="sub">${log.length} registros</span></div>
    <div class="hbars">${mot.map(([k, v], i) => `<div class="hb"><span class="l">${esc(MOTIVOS[k] || k)}</span><div class="tr"><div class="b grow" style="--i:${i};width:${(v / mmax * 100).toFixed(1)}%" data-tipv="${v}" data-tipl="${esc(MOTIVOS[k] || k)} · ${Math.round(v / log.length * 100)}%"></div><span class="v">${v}</span></div></div>`).join('')}</div></div>`;
  const top = rep.slice().sort((a, b) => Math.abs(b.c.dFim) - Math.abs(a.c.dFim)).slice(0, 8), tmax = Math.max(1, ...top.map(x => Math.abs(x.c.dFim)));
  const topHTML = `<div class="card r-half rise" style="--i:5"><div class="card-h"><h2>Maiores deslocamentos do fim</h2><span class="sub">plano atual vs. original</span></div>
    <div class="hbars">${top.map((x, i) => `<div class="hb" data-act="open-act" data-id="${x.a.id}" style="cursor:pointer" tabindex="0"><span class="l"><span class="mono muted" style="font-size:11.5px">${esc(x.a.codigo || '')}</span> ${esc(x.a.titulo)}</span><div class="tr"><div class="b grow" style="--i:${i};--c:${x.c.dFim > 0 ? 'var(--st-late)' : 'var(--st-done)'};width:${(Math.abs(x.c.dFim) / tmax * 100).toFixed(1)}%" data-tipv="${fdelta(x.c.dFim)}" data-tipl="${esc(x.a.titulo)} · ${x.c.nRep} ${x.c.nRep === 1 ? 'revisão' : 'revisões'}"></div><span class="v">${fdelta(x.c.dFim)}</span></div></div>`).join('')}</div></div>`;
  let lastM = '';
  const tl = `<div class="card rise" style="--i:6"><div class="card-h"><h2>Histórico de replanejamentos</h2><span class="sub">mais recentes primeiro</span></div><ul class="tl">${log.map(({ x, r, n }) => {
    const dt = new Date(r.em), mk2 = isNaN(dt) ? '' : MESL[dt.getMonth()] + ' de ' + dt.getFullYear();
    const g = mk2 !== lastM ? `<li class="grp">${mk2.charAt(0).toUpperCase() + mk2.slice(1)}</li>` : ''; lastM = mk2;
    const ch = [];
    if (r.iniDe !== r.iniPara) ch.push(`Início ${fds(P(r.iniDe))} → ${fds(P(r.iniPara))} ${dlt(dd(P(r.iniDe), P(r.iniPara)))}`);
    if (r.fimDe !== r.fimPara) ch.push(`Fim ${fds(P(r.fimDe))} → ${fds(P(r.fimPara))} ${dlt(dd(P(r.fimDe), P(r.fimPara)))}`);
    return g + `<li data-act="open-act" data-id="${x.a.id}" style="cursor:pointer" tabindex="0"><div class="mk">${revSvg(n)}</div><div style="min-width:0">
      <div class="hd"><span class="mono muted" style="font-size:12px">${esc(x.a.codigo || '')}</span><b>${esc(x.a.titulo)}</b><span class="when">${isNaN(dt) ? '' : dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}${r.por && personName(r.por) ? ' · ' + esc(personName(r.por)) : ''}</span></div>
      <div class="ch">${ch.join('<span>·</span>')}</div>
      <div class="why"><span class="mot">${esc(MOTIVOS[r.motivo] || r.motivo || 'Outro')}</span>${esc(r.comentario || '')}</div></div></li>`; }).join('')}</ul></div>`;
  return `<div class="rgrid">${kpis}${motHTML}${topHTML}${tl}</div>`;
}

  }
  const patch = { ...v, atualizadoEm: nowISO() };
  if ((v.respId && v.respId !== (a.respId || '')) || v.apoioIds.some(id => !(a.apoioIds || []).includes(id))) { patch.atribuidoEm = nowISO(); patch.atribuidoPor = S.userId; }
  if (!a.iniOrig) patch.iniOrig = a.iniPlan;
  if (!a.fimOrig) patch.fimOrig = a.fimPlan;
  const changed = v.iniPlan !== a.iniPlan || v.fimPlan !== a.fimPlan;
  if (changed) {
    const r = await askReplan(a, v.iniPlan, v.fimPlan);
    if (!r) return;
    patch.replans = [...(a.replans || []), { em: nowISO(), por: S.userId, iniDe: a.iniPlan, iniPara: v.iniPlan, fimDe: a.fimPlan, fimPara: v.fimPlan, motivo: r.motivo, comentario: r.comentario }];
  }
  const wasDone = !!a.fimReal;
  if (await write(() => db.doc('atividades/' + a.id).update(patch))) {
    const LBL = { titulo: 'nome', metaId: 'projeto', respId: 'responsável', apoioIds: 'apoio', prioridade: 'prioridade', peso: 'peso', iniReal: 'início real', fimReal: 'fim real', progresso: 'avanço', manual: 'situação', obs: 'observações' };
    const chg = Object.keys(LBL).filter(k => JSON.stringify(v[k] ?? (k === 'apoioIds' ? [] : '')) !== JSON.stringify(a[k] ?? (k === 'apoioIds' ? [] : ''))).map(k => LBL[k]);
    if (changed) logEvt('replan', a, `Replanejada: ${fds(P(a.iniPlan))}→${fds(P(v.iniPlan))}, ${fds(P(a.fimPlan))}→${fds(P(v.fimPlan))} · ${MOTIVOS[patch.replans[patch.replans.length - 1].motivo]}`);
    if (chg.length) logEvt('edicao', a, `Alterado: ${chg.join(', ')}${v.fimReal && !a.fimReal ? ` · concluída em ${fds(P(v.fimReal))}` : ''}`);
    closeDrawer(); S.flash = a.id; setTimeout(() => S.flash = null, 1700);
    const fo = P(v.fimPlan);
    if (!wasDone && fr != null) { if (fr <= fo) { celebrate(); toast('Concluída dentro do prazo planejado.', 'ok'); } else toast(`Concluída com ${fdelta(dd(fo, fr))} de atraso em relação ao plano atual.`, 'warn'); }
    else toast(changed ? `Replanejamento registrado (revisão ${patch.replans.length}).` : 'Alterações salvas.', 'ok');
  }
}
function nextCode() {
  let mx = 0; S.atividades.forEach(a => { const n = parseInt(String(a.codigo || '').replace(/\D/g, ''), 10); if (n > mx) mx = n; });
  return 'ATV-' + String(mx + 1).padStart(3, '0');
}

/* replanejamento: motivo obrigatório */
function askReplan(a, ini, fim) {
  return new Promise(res => {
    const io = P(a.iniOrig) ?? P(a.iniPlan), fo = P(a.fimOrig) ?? P(a.fimPlan);
    const n = (a.replans || []).length + 1;
    const ni = P(ini), nf = P(fim), oi = P(a.iniPlan), of = P(a.fimPlan);
    const durO = dur(io, fo), dDur = dur(ni, nf) - durO;
    const row = (l, de, para, vsAnt, vsOrig) => `<tr><td>${l}</td><td class="mono">${fds(de)}</td><td class="mono"><b>${fds(para)}</b></td><td>${dlt(vsAnt)}</td><td>${dlt(vsOrig)}</td></tr>`;
    openModal(`<form id="frp" novalidate>
      <div class="md-h"><h3>Registrar replanejamento</h3><p>${esc(a.codigo || '')} · ${esc(a.titulo)}</p></div>
      <div class="md-b">
        <div class="revcard"><div class="rh">${revSvg(n)}Revisão ${n}</div>
          <table><thead><tr><th></th><th>De</th><th>Para</th><th>vs. anterior</th><th>vs. original</th></tr></thead><tbody>
          ${row('Início', oi, ni, dd(oi, ni), dd(io, ni))}${row('Fim', of, nf, dd(of, nf), dd(fo, nf))}
          <tr><td>Duração</td><td class="mono">${dur(oi, of)} ${U()}</td><td class="mono"><b>${dur(ni, nf)} ${U()}</b></td><td>${dlt(dur(ni, nf) - dur(oi, of))}</td><td>${dlt(dDur)}${dDur && durO ? ` <span class="muted" style="font-size:11.5px">${dDur > 0 ? '+' : '−'}${Math.abs(Math.round(dDur / durO * 100))}%</span>` : ''}</td></tr>
          </tbody></table></div>
        <div class="f"><span class="lab">Motivo <span class="req">*</span></span><div class="chips">${Object.entries(MOTIVOS).map(([k, l]) => `<label><input type="radio" name="rp-mot" value="${k}">${l}</label>`).join('')}</div></div>
        <div class="f"><label for="rp-txt">Justificativa <span class="req">*</span></label><textarea class="inp" id="rp-txt" maxlength="600" placeholder="O que aconteceu e o que muda a partir de agora"></textarea></div>
        <p class="muted" style="margin:0;font-size:12.5px">A data original (${fds(io)} → ${fds(fo)}) continua guardada como referência das variações. O atraso passa a ser medido pelo novo plano.</p>
        <p class="err" id="rp-err" role="alert"></p>
      </div>
      <div class="md-f"><button type="button" class="btn ghost" data-act="close-modal">Voltar e revisar</button><button type="submit" class="btn primary">${ic('rev')}Confirmar replanejamento</button></div></form>`);
    S.modalCancel = () => res(null);
    $('#frp').addEventListener('submit', e => {
      e.preventDefault();
      const mot = ($('input[name="rp-mot"]:checked') || {}).value, txt = $('#rp-txt').value.trim();
      if (!mot) { $('#rp-err').textContent = 'Escolha o motivo do replanejamento.'; return; }
      if (txt.length < 5) { $('#rp-err').textContent = 'Escreva uma justificativa (pelo menos 5 caracteres).'; $('#rp-txt').focus(); return; }
      S.modalCancel = null; closeModal(); res({ motivo: mot, comentario: txt });
    });
  });
}

/* ações rápidas */
async function quickStart(id) {
  const a = S.atividades.find(x => x.id === id); if (!a) return;
  const T = ISO(today());
  if (await write(() => db.doc('atividades/' + id).update({ iniReal: T, atualizadoEm: nowISO() }))) {
    logEvt('edicao', a, `Iniciada em ${fds(P(T))}`);
    toast(`${a.codigo} iniciada hoje.`, 'ok', 'Desfazer', () => write(() => db.doc('atividades/' + id).update({ iniReal: a.iniReal || '', atualizadoEm: nowISO() })));
  }
}
async function quickFinish(id, el) {
  const a = S.atividades.find(x => x.id === id); if (!a) return;
  const T = today(), fo = P(a.fimPlan), rect = el && el.getBoundingClientRect();
  const patch = { fimReal: ISO(T), atualizadoEm: nowISO() };
  if (a.progresso != null) patch.progresso = 100;
  if (await write(() => db.doc('atividades/' + id).update(patch))) {
    logEvt('edicao', a, `Concluída em ${fds(T)}`);
    const undo = () => write(() => db.doc('atividades/' + id).update({ fimReal: a.fimReal || '', progresso: a.progresso ?? null, atualizadoEm: nowISO() }));
    if (T <= fo) { celebrate(rect); toast(`${a.codigo} concluída dentro do prazo planejado.`, 'ok', 'Desfazer', undo); }
    else toast(`${a.codigo} concluída com ${fdelta(dd(fo, T))} de atraso em relação ao plano atual.`, 'warn', 'Desfazer', undo);
  }
}

/* exclusões com confirmação no próprio botão */
function armed(btn, label) {
  if (btn.classList.contains('armed')) return true;
  btn.classList.add('armed'); const old = btn.innerHTML; btn.innerHTML = ic('lixo') + label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.innerHTML = old; } }, 4000);
  return false;
}

  if (await write(() => db.doc('atividades/' + id).delete())) { logEvt('exclusao', a, `Atividade excluída: ${a.titulo}`); closeDrawer(); toast(`${a.codigo} excluída.`, '', 'Desfazer', () => write(() => db.doc('atividades/' + id).set(copy))); }
}
async function delMeta(id, btn) {

async function write(fn, quiet = false) {
  if (!db) { toast('Sem conexão com os dados.', 'err'); return false; }
  for (let attempt = 0; attempt < 3; attempt++) {
    try { await fn(); S.wrote = true; return true; }
    catch (e) {
      const code = e && e.code;
      if ((code === 'unavailable' || code === 'resource_exhausted') && attempt < 2) { await new Promise(r => setTimeout(r, 600 + Math.random() * 900 * (attempt + 1))); continue; }
      if (code === 'invalid_argument' && !S.wrote && !S.writeKnown) { S.canWrite = false; closeDrawer(); closeModal(); render(); toast('Seu acesso a este painel é somente de visualização.', 'warn'); return false; }
      if (!quiet) toast(code === 'quota_exceeded' ? 'O limite de armazenamento foi atingido. Apague itens antigos para continuar.' : code === 'revoked' ? 'Seu acesso a este painel mudou. Recarregue a página.' : 'Não foi possível salvar. Tente de novo em instantes.', 'err');
      return false;
    }
  }
  return false;
}
function onData() {
  S.ver++;
  const L = S.loaded;
  if (S.state === 'ready' && S.proj && S.proj !== '_none' && !metaById(S.proj)) { location.hash = 'projetos'; }
  if (S.state === 'loading' && L.a && L.m && L.p && L.c) { S.state = 'ready';
    if (S.proj && S.proj !== '_none' && !metaById(S.proj)) { S.view = 'projetos'; S.proj = null; history.replaceState(null, '', '#projetos'); } S.animUntil = performance.now() + 1500; resolveNames(); }
  schedule();
}
async function resolveNames() {
  if (!userCap) return;
  const ids = new Set(); S.atividades.forEach(a => (a.replans || []).forEach(r => r.por && r.por !== S.userId && ids.add(r.por)));
  const need = [...ids].filter(i => !(i in S.names)); if (!need.length) return;
  try { const ps = await userCap.profiles(need); let ch = false; need.forEach(i => { const n = (ps[i] && ps[i].name) || ''; if (S.names[i] !== n) { S.names[i] = n; ch = true; } }); if (ch) schedule(); } catch (e) {}
}
async function boot() {
  render();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.state = 'off'; render(); return; }
  [db, userCap, downloads] = await Promise.all([c.use('db'), c.use('user'), c.use('downloads')]);
  if (!db) { S.state = 'off'; render(); return; }
  if (userCap) {
    try { S.userId = await userCap.id(); } catch (e) {}
    try { const w = await userCap.can('data.write'); S.canWrite = w === null ? true : !!w; S.writeKnown = w !== null; } catch (e) { S.canWrite = true; }
  } else S.canWrite = true;
  const err = e => { if (e && e.code === 'revoked') { S.state = 'off'; render(); } };
  const coll = (name, key) => db.collection(name).onSnapshot(s => { S[name] = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded[key] = true; if (name === 'atividades') resolveNames(); onData(); }, err);
  coll('atividades', 'a'); coll('metas', 'm'); coll('pessoas', 'p');
  db.collection('reunioes').onSnapshot(s => { S.reunioes = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ver++; schedule(); }, () => {});
  db.doc('config/geral').onSnapshot(s => { S.cfg = { ...DEFAULT_CFG, ...(s.exists ? s.data() : {}) }; S.loaded.c = true; onData(); }, err);
}

const tipEl = $('#tip');
function showTip(x, y, html) {
  tipEl.innerHTML = html; tipEl.classList.add('on');
  const r = tipEl.getBoundingClientRect(); let lx = x + 14, ly = y + 14;
  if (lx + r.width > innerWidth - 8) lx = x - r.width - 14;
  if (ly + r.height > innerHeight - 8) ly = y - r.height - 14;
  tipEl.style.left = Math.max(8, lx) + 'px'; tipEl.style.top = Math.max(8, ly) + 'px';
}
function hideTip() { tipEl.classList.remove('on'); }
function tipFor(el) {
  if (el.dataset.tipv != null) return `<div class="tr"><b>${esc(el.dataset.tipv)}</b><span>${esc(el.dataset.tipl || '')}</span></div>`;
  const lines = String(el.dataset.tip).split('\n');
  return lines.length > 1 ? `<div class="th">${esc(lines[0])}</div>${lines.slice(1).map(l => `<div>${esc(l)}</div>`).join('')}` : esc(lines[0]);
}
document.addEventListener('pointermove', e => {
  const el = e.target.closest && e.target.closest('[data-tip],[data-tipv]');

}, { passive: true });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip],[data-tipv]'); if (el) { const r = el.getBoundingClientRect(); showTip(r.left + r.width / 2, r.bottom, tipFor(el)); } });
document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, { passive: true, capture: true });

function toast(msg, kind = '', actLabel, actFn, ms = 5200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `${ic(kind === 'ok' ? 'check' : kind === 'err' ? 's_late' : kind === 'warn' ? 's_alert' : 'info')}<span></span>`;
  el.querySelector('span').textContent = msg;
  if (actLabel) { const b = document.createElement('button'); b.textContent = actLabel; b.onclick = () => { dismissToast(el); actFn && actFn(); }; el.appendChild(b); }
  $('#toasts').appendChild(el);
  el._t = setTimeout(() => dismissToast(el), ms);
  return el;
}
function dismissToast(el) { if (!el || !el.isConnected) return; clearTimeout(el._t); el.classList.add('out'); setTimeout(() => el.remove(), 260); }

const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], cRun = 0;
function celebrate(el) {
  if (REDUCED) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  let ox = innerWidth / 2, oy = innerHeight * 0.35;
  if (el && el.width) { ox = el.left + el.width / 2; oy = el.top + el.height / 2; }
  const cols = ['#0ca30c', '#2445d6', '#fab219', '#9fb2ff', '#1baf7a', '#e87ba4'];
  for (let i = 0; i < 140; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = 6 + Math.random() * 9; parts.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 3 + Math.random() * 4, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 0, tri: Math.random() < .3 }); }
  if (!cRun) cRun = requestAnimationFrame(tickC);
}
function tickC() {
  const dpr = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    cx.save(); cx.translate(p.x * dpr, p.y * dpr); cx.rotate(p.rot); cx.globalAlpha = Math.max(0, 1 - p.life / 120); cx.fillStyle = p.c;
    if (p.tri) { cx.beginPath(); cx.moveTo(0, -p.r * dpr); cx.lineTo(p.r * dpr, p.r * dpr); cx.lineTo(-p.r * dpr, p.r * dpr); cx.closePath(); cx.fill(); } else cx.fillRect(-p.r * dpr, -p.r * .5 * dpr, p.r * 2 * dpr, p.r * dpr);
    cx.restore(); });
  parts = parts.filter(p => p.life < 120 && p.y < innerHeight + 40);
  cRun = parts.length ? requestAnimationFrame(tickC) : (cx.clearRect(0, 0, cv.width, cv.height), 0);
}
