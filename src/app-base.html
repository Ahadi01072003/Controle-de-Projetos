<title>Controle de Projetos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: floating dark rail on a cool drafting-paper ground; one working canvas per view.
   Signature detail: replans are marked like drawing revisions (triangle + number) and every
   variance is a signed Δ in days. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --sunken:#e8ebf0;
  --ink:#131722; --ink-2:#4a5162; --muted:#757c8f; --line:#e1e4eb; --line-2:#cdd2dc;
  --accent:#2445d6; --accent-2:#1a35ad; --accent-soft:#e6ebfd; --on-accent:#ffffff;
  --rail:#121624; --rail-ink:#d4d9e6; --rail-ink-2:#8189a0; --rail-hi:#202741;
  --good-ink:#0b7a24; --bad-ink:#c02d2d;
  --st-none:#8b92a4; --st-latestart:#ec835a; --st-run:#2a78d6; --st-risk:#fab219; --st-late:#d03b3b;
  --st-done:#0ca30c; --st-donelate:#6250d6; --st-pause:#5ba4b3; --st-cancel:#b5bac5;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --hatch:rgba(19,23,34,.13); --k-orig:#a2a8b6;
  --shadow:0 1px 2px rgba(19,23,34,.05),0 10px 30px -18px rgba(19,23,34,.25);
  --shadow-lg:0 30px 80px -20px rgba(19,23,34,.45);
  --f-display:'Bricolage Grotesque','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151921; --surface-2:#1a1f29; --sunken:#10131a;
  --ink:#eceef4; --ink-2:#b3b9c8; --muted:#868d9f; --line:#242a36; --line-2:#343b4a;
  --accent:#8099ff; --accent-2:#a6b6ff; --accent-soft:#1c2445; --on-accent:#0d1016;
  --rail:#090b10; --rail-ink:#d4d9e6; --rail-ink-2:#737b90; --rail-hi:#1a1f30;
  --good-ink:#3ccf5a; --bad-ink:#ff7a7a;
  --st-none:#7a8296; --st-run:#3987e5; --st-donelate:#9085e9; --st-pause:#4f93a2; --st-cancel:#4d5362;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --hatch:rgba(255,255,255,.12); --k-orig:#6b7285;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151921; --surface-2:#1a1f29; --sunken:#10131a;
  --ink:#eceef4; --ink-2:#b3b9c8; --muted:#868d9f; --line:#242a36; --line-2:#343b4a;
  --accent:#8099ff; --accent-2:#a6b6ff; --accent-soft:#1c2445; --on-accent:#0d1016;
  --rail:#090b10; --rail-ink:#d4d9e6; --rail-ink-2:#737b90; --rail-hi:#1a1f30;
  --good-ink:#3ccf5a; --bad-ink:#ff7a7a;
  --st-none:#7a8296; --st-run:#3987e5; --st-donelate:#9085e9; --st-pause:#4f93a2; --st-cancel:#4d5362;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --hatch:rgba(255,255,255,.12); --k-orig:#6b7285;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--rail);color:var(--rail-ink);border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;gap:22px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1.1}
.brand small{display:block;color:var(--rail-ink-2);font-size:11.5px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--rail-ink);text-decoration:none;font-weight:500;position:relative;transition:background .18s,color .18s}
.nav a .ic{color:var(--rail-ink-2);transition:color .18s,transform .25s}
.nav a:hover{background:var(--rail-hi)}
.nav a:hover .ic{transform:translateX(1px)}
.nav a.on{background:var(--rail-hi);color:#fff}
.nav a.on .ic{color:#9fb2ff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#9fb2ff}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-ink-2)}
.nav .cnt.hot{color:#ff9b9b}
.nav-sec{margin:14px 10px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-ink-2)}
.nav a.pj{font-size:13px;padding:7px 10px}
.nav a.pj .pjn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav a.back{color:var(--rail-ink-2);font-size:13px}
.nav-proj{display:flex;align-items:center;gap:9px;margin:8px 10px 10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;font-family:var(--f-display);font-weight:650;font-size:15px;line-height:1.25}
.nav-proj span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ic.flip{transform:scaleX(-1)}
.proj-eb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--rail-ink-2)}
.live{display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:#4ad66d;box-shadow:0 0 0 0 rgba(74,214,109,.6);animation:live 2.4s infinite}
.live.off i{background:#8189a0;animation:none}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(74,214,109,.55)}70%{box-shadow:0 0 0 7px rgba(74,214,109,0)}100%{box-shadow:0 0 0 0 rgba(74,214,109,0)}}
.kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:0 4px;color:var(--rail-ink)}

.main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-bottom:40px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;padding-top:6px}
.topbar h1{margin:0;font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.topbar p{margin:4px 0 0;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ro-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12.5px;font-weight:500}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;font-size:13.5px;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--st-late) 40%,transparent);background:transparent}
.btn.danger.armed{background:var(--st-late);color:#fff;border-color:var(--st-late)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.icon.sm{width:30px;padding:0}
.btn[disabled]{opacity:.5;pointer-events:none}

.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.banner b{font-weight:650}
.banner .sp{flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.card-h .sub{color:var(--muted);font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:10px 0 6px;color:var(--ink);font-family:var(--f-display);font-size:20px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.empty svg.big{width:64px;height:64px;color:var(--line-2)}

.st{--c:var(--st-none);display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);font-size:12.5px;font-weight:550;white-space:nowrap;line-height:1.35}
.st .ic{width:15px;height:15px;color:var(--c);stroke-width:2.1}
.st.sm{font-size:11.5px;padding:2px 7px 2px 5px}
.st.sm .ic{width:13px;height:13px}
.st.lg{font-size:14px;padding:6px 12px 6px 9px}
.st.lg .ic{width:18px;height:18px}
.s-none{--c:var(--st-none)} .s-latestart{--c:var(--st-latestart)} .s-run{--c:var(--st-run)} .s-risk{--c:var(--st-risk)}
.s-late{--c:var(--st-late)} .s-done{--c:var(--st-done)} .s-donelate{--c:var(--st-donelate)} .s-pause{--c:var(--st-pause)} .s-cancel{--c:var(--st-cancel)}
.st.s-late .ic{animation:beat 1.9s ease-in-out infinite}
.st.s-cancel span{text-decoration:line-through;text-decoration-thickness:1px}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none}

.dl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl.up{color:var(--bad-ink);background:color-mix(in srgb,var(--st-late) 11%,transparent)}
.dl.dn{color:var(--good-ink);background:color-mix(in srgb,var(--st-done) 12%,transparent)}
.dl.zero{color:var(--muted);background:var(--sunken)}
.rev{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.rev .ic{width:14px;height:14px;stroke-width:2;fill:color-mix(in srgb,var(--st-risk) 45%,transparent)}
.av{--c:var(--c1);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.av.sm{width:20px;height:20px;font-size:9px}
.av.lg{width:38px;height:38px;font-size:13px}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-width:0}
.mchip .dot{width:8px;height:8px;border-radius:2px}
.mchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio{font-size:11.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.prio i{display:inline-flex;gap:1.5px;align-items:flex-end;height:10px}
.prio i b{width:3px;border-radius:1px;background:var(--line-2)}
.prio i b:nth-child(1){height:4px}.prio i b:nth-child(2){height:7px}.prio i b:nth-child(3){height:10px}
.prio.p-baixa i b:nth-child(1),.prio.p-media i b:nth-child(-n+2),.prio.p-alta i b{background:var(--ink-2)}
.prio.p-alta{color:var(--ink)}
.prio.p-alta i b{background:var(--st-latestart)}

.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left}
.segbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--sunken)}
.segbar i{display:block;height:100%;background:var(--c)}

/* ---------- motion on view entry ---------- */
.view{min-width:0}
.view.anim .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
.view.anim .grow{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(120ms + var(--i,0) * 50ms)}
.view.anim .ringfg{animation:ring 1.1s cubic-bezier(.2,.7,.2,1) both .1s}
.view.anim .donut-cover{animation:donut 1.1s cubic-bezier(.45,.05,.25,1) both .1s}
.view.anim .draw{animation:draw 1.3s cubic-bezier(.45,.05,.25,1) both .2s}
.view.anim .fadein{animation:fade .8s ease both .5s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{from{stroke-dasharray:0 100}}
@keyframes donut{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--C)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}

/* ---------- painel ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dash > *{grid-column:span 12}
.hero{grid-column:span 4;display:flex;gap:18px;align-items:center;background:var(--rail);color:#fff;border-color:transparent;position:relative;overflow:hidden}
.hero .eyebrow{color:#9aa3bb}
.hero .big{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:6px 0 6px}
.hero p{margin:0;color:#b8bfd1;font-size:13px;max-width:30ch}
.hero .hero-l{margin:0 0 8px;color:#dfe4ef;font-size:13.5px;max-width:none}
.hero .hero-l b{color:#fff}
.hero-b{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#b8bfd1}
.hero-b li{display:flex;gap:7px;align-items:baseline}
.hero-b li i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none;transform:translateY(-1px)}
.hero-b b{color:#fff;font-weight:650}
.hero .ring{width:112px;height:112px;flex:none}
.hero .ring .ringbg{stroke:rgba(255,255,255,.12)}
.hero .ring .ringfg{stroke:#9fb2ff}
.kpis{grid-column:span 8;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0;overflow:hidden}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kpi:nth-child(3n){border-right:0}
.kpi:nth-last-child(-n+3){border-bottom:0}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px;font-weight:500}
.kpi .lbl .ic{width:16px;height:16px;color:var(--c,var(--muted))}
.kpi .val{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .foot{color:var(--muted);font-size:12px}
.kpi.click{cursor:pointer;transition:background .15s}
.kpi.click:hover{background:var(--surface-2)}
.c-donut{grid-column:span 5}
.c-scurve{grid-column:span 7}
.c-list{grid-column:span 4}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:168px;height:168px;flex:none;overflow:visible}
.donut .seg{transition:stroke-width .2s;cursor:pointer}
.donut .seg:hover,.donut .seg:focus{stroke-width:26}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;flex:1;min-width:210px}
.legend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer;transition:background .15s;white-space:nowrap;font-size:13px}
.legend li:hover{background:var(--surface-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend .n{font-weight:650;font-variant-numeric:tabular-nums}
.legend .p{color:var(--muted);font-size:12px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.lkeys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.lkeys span{display:inline-flex;align-items:center;gap:6px}
.lkeys i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c)}
.lkeys i.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--c)}
.lkeys i.box{width:12px;height:10px;border:1.5px dashed var(--muted);border-radius:3px;background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 5px)}
.lkeys i.solid{width:12px;height:8px;border:0;border-radius:3px;background:var(--c)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2)}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ilist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.ilist li:first-child{border-top:0}
.ilist li:hover{background:var(--surface-2)}
.ilist .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .s{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;min-width:0}
.cal{width:42px;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;background:var(--surface)}
.cal b{display:block;font-size:16px;line-height:1.3;font-weight:700}
.cal small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;background:var(--sunken);color:var(--ink-2);padding:1px 0;font-weight:600}
.cal.hot small{background:var(--st-late);color:#fff}
.when{font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.when.hot{color:var(--bad-ink)}
.mini-m{display:flex;flex-direction:column;gap:12px}
.mini-m .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;cursor:pointer}

/* ---------- toolbar & filters ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{position:relative;display:flex;align-items:center}
.field .ic{position:absolute;left:10px;color:var(--muted);pointer-events:none;width:16px;height:16px}
.inp,.sel{height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 11px;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus,.sel:focus,textarea.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field .inp{padding-left:32px;width:240px;max-width:100%}
.sel{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:220px}
.tog{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;user-select:none;font-weight:500}
.tog input{accent-color:var(--accent)}
.stchips{display:flex;gap:6px;flex-wrap:wrap}
.stchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 7px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);transition:all .15s}
.stchips button .dot{background:var(--c)}
.stchips button b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.stchips button:hover{border-color:var(--line-2)}
.stchips button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink)}
.stchips button[disabled]{opacity:.45}
.seg-ctl{display:inline-flex;padding:3px;border-radius:10px;background:var(--sunken);gap:2px}
.seg-ctl button,.seg-ctl label{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg-ctl button.on,.seg-ctl label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-ctl input{position:absolute;opacity:0;pointer-events:none}
.count-note{color:var(--muted);font-size:12.5px;margin-left:auto}

.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.frow .f-search{flex:2 1 260px}
.frow .fsel{flex:1 1 160px}
.frow .tog{flex:none}
.f-search{align-self:end}
.f-search .inp{width:100%}
.fsel{display:flex;flex-direction:column;gap:4px;min-width:0}
.fsel span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fsel .sel{width:100%;max-width:none}
.fpanel .tog{white-space:nowrap}
.fpanel .tog.on{border-color:var(--accent);background:var(--accent-soft)}
.frow2{display:flex;align-items:flex-start;gap:10px 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.flabel{padding-top:7px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.frow2 .stchips{flex:1;min-width:0;gap:8px}
.fmeta{display:flex;align-items:center;gap:10px;margin-left:auto;min-height:30px}
.fmeta .count-note{margin:0;white-space:nowrap}
@media (max-width:1180px){.frow .f-search{flex-basis:100%}}
@media (max-width:600px){.frow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.frow .fsel{flex-basis:calc(50% - 5px)}.fpanel .tog{flex:1 1 100%;justify-content:center}.frow2{flex-direction:column;align-items:stretch;gap:8px}.flabel{padding-top:0}.fmeta{margin-left:0;justify-content:space-between}}
/* ---------- etapas ---------- */
.eb-n{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 5px;border-radius:6px;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:10.5px;font-weight:700;flex:none}
.chev{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--muted);flex:none;transition:transform .2s,background .15s}
.chev .ic{width:14px;height:14px}
.chev.open{transform:rotate(90deg)}
.grp-row{cursor:pointer}
.grp-row td{background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line)}
.grp-row:hover td{background:var(--sunken)}
.grp-row:hover .chev{background:var(--surface)}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.grp-h .gn{font-weight:650;font-size:14px}
.grp-h .gc{font-size:12px}
.grp-h .gd{font-size:11.5px;color:var(--ink-2)}
.grp-h .gs{width:110px;height:6px}
.grp-h .gp{display:inline-flex;align-items:center;gap:6px}
.grp-h .gp .bar{width:70px}
.grp-h .ga{margin-left:auto}
.grp-empty-row td{color:var(--muted);font-size:12.5px;padding:12px 16px 12px 46px;border-bottom:1px solid var(--line)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer}
.grp-card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin-top:6px}
.grp-empty{margin:0 0 4px 12px;font-size:12.5px}
.g-grp .g-label{cursor:pointer;gap:8px}
.g-grp .g-label .nm{font-weight:700}
.g-grp.closed{background:var(--surface)}
.g-track .g-sum{top:15px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));overflow:hidden;opacity:1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.g-track .g-sum i{display:block;height:100%;background:var(--accent)}
.g-cnt{position:absolute;top:13px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;line-height:18px}
.g-cnt .neg{color:var(--bad-ink)}
.etiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.etile{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,transform .2s,box-shadow .2s}
.etile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(0,0,0,.5)}
.et-top{display:flex;align-items:center;gap:8px;min-width:0}
.et-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.et-mid{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px}
.et-mid .big{font-size:22px;font-weight:650;color:var(--ink)}
.et-ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.et-ft span:first-child{margin-right:auto}
.et-list{display:flex;flex-direction:column;gap:6px}
.et-row{display:flex;align-items:center;gap:6px}
.et-row .inp{flex:1;height:34px;min-width:0}
.et-row .et-n{font-size:11.5px;min-width:44px;text-align:right}
.np-edit{margin-left:auto;border:0;background:transparent;color:var(--rail-ink-2);border-radius:6px;width:26px;height:26px;display:grid;place-items:center;flex:none;cursor:pointer}
.np-edit:hover{background:var(--rail-hi);color:#fff}
.np-edit .ic{width:15px;height:15px}

/* ---------- diário ---------- */
.dwrap{display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;flex-direction:column;gap:14px}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav .inp{width:170px}
.dday{display:flex;flex-direction:column;margin-left:8px}
.dday b{font-family:var(--f-display);font-size:18px;font-weight:650}
.dday span{font-size:12px}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dstats > div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dstats span{font-size:11.5px;color:var(--muted);font-weight:600}

.dstats b.neg{color:var(--bad-ink)}.dstats b.pos{color:var(--good-ink)}
.dstats.sm b{font-size:16px}
.dhint{margin:0;font-size:12px}
.dsec{display:flex;flex-direction:column;gap:8px}
.dsec-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.dsec-h h3{margin:0;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(220px,1fr);gap:12px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:border-color .2s}
.drow.has-feito{border-color:color-mix(in srgb,var(--st-done) 45%,var(--line))}
.drow.has-parcial{border-color:color-mix(in srgb,var(--st-risk) 55%,var(--line))}
.drow.has-nao{border-color:color-mix(in srgb,var(--st-late) 45%,var(--line))}
.dl-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.dl-top{display:flex;align-items:center;gap:8px;min-width:0}
.dl-top .mono{font-size:11.5px}
.dl-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dl-t:hover{color:var(--accent)}
.dl-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pendtag{font-size:11px;font-weight:650;color:var(--bad-ink);background:color-mix(in srgb,var(--st-late) 12%,transparent);padding:1px 7px;border-radius:99px}
.dl-act{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dbtns{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.db{border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;transition:background .15s,color .15s,transform .1s}
.db + .db{border-left:1px solid var(--line-2)}
.db .ic{width:15px;height:15px}
.db:hover{background:var(--surface-2)}
.db:active{transform:scale(.97)}
.db.feito.on{background:var(--st-done);color:#fff}
.db.parcial.on{background:var(--st-risk);color:#131722}
.db.nao.on{background:var(--st-late);color:#fff}
.db[disabled]{opacity:.55;cursor:default}
.dpart{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dpart .inp{width:72px;height:30px}
.chipb{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chipb:hover{border-color:var(--ink-2)}
.chipb.on{background:var(--st-risk);border-color:var(--st-risk);color:#131722}
.chipb.ghost{border-color:transparent;color:var(--muted)}
.dl-meter{display:flex;flex-direction:column;gap:5px;min-width:0}
.dm-bar{position:relative;height:8px;border-radius:99px;background:var(--sunken)}
.dm-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.dm-bar b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.dm-txt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.dimp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:5px 8px;animation:fade .4s ease}
.dimp .ic{width:14px;height:14px;color:var(--accent)}
.plist{display:flex;flex-direction:column}
.pl-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}

.dcal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15;transition:transform .12s,background .15s}
.dc:hover:not([disabled]){transform:translateY(-1px);border-color:var(--ink-2)}
.dc small{font-size:9.5px;color:var(--muted);font-weight:600}
.dc b{font-size:13px;font-variant-numeric:tabular-nums}
.dc i{font-style:normal;font-size:10px;font-weight:700;min-height:12px}
.dc.feito{background:color-mix(in srgb,var(--st-done) 22%,var(--surface));border-color:var(--st-done)}
.dc.parcial{background:color-mix(in srgb,var(--st-risk) 28%,var(--surface));border-color:var(--st-risk)}
.dc.nao{background:color-mix(in srgb,var(--st-late) 18%,var(--surface));border-color:var(--st-late)}
.dc.pend{border-style:dashed;border-color:var(--st-late)}
.dc.fut{opacity:.45}
.dc.ext{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px)}
.dc.today{box-shadow:0 0 0 2px var(--accent)}
.dspark{width:100%;height:64px;display:block}
#a-daily .hint{font-size:12px;color:var(--muted)}
#a-daily{gap:10px}
.hol-list{display:flex;gap:6px;flex-wrap:wrap}
.hol{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px;font-family:var(--f-mono)}

@media (max-width:900px){.drow{grid-template-columns:minmax(0,1fr)}.dstats{grid-template-columns:repeat(2,minmax(0,1fr))}.pl-row{grid-template-columns:minmax(0,1fr)}.pl-d{justify-content:flex-start}}

.dsel{width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer}

.dbulk{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--rail);color:#eef1f8;border-radius:14px;padding:10px 12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);animation:tin .3s cubic-bezier(.2,.8,.2,1)}
.dbulk .muted{color:#9aa3bb}

.dbulk .chipb{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#eef1f8}

.dbulk .inp{width:64px;height:30px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#eef1f8}
.dbulk .btn.ghost{color:#9aa3bb;margin-left:auto}
.bk-part{display:inline-flex;gap:4px;align-items:center}

/* ---------- etapas dentro da atividade ---------- */
.sub-tog{border:0;background:transparent;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;vertical-align:middle;transition:transform .2s,background .15s}

.tbl tr.subrow .code{display:table-cell;white-space:nowrap}
.tbl tr.subrow .code .eb-n,.tbl tr.subrow .code .rev{vertical-align:middle;margin-right:4px}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--c,var(--line-2))}
.sr-main{display:flex;align-items:flex-start;gap:10px}
.sr-t{display:block;font-size:13.5px}
.sr-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--ink-2);margin-top:3px}
.sr-st{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sr-act{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.sub-sum{font-size:13px;color:var(--ink-2)}
.dcal.sm{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}

.g-sub .g-label{padding-left:30px;font-size:12.5px}

.g-sub .g-orig{top:6px;height:4px}.g-sub .g-plan{top:12px;height:11px}.g-sub .g-real{top:26px;height:4px}.g-sub .g-tag{top:9px}

.rp-proj{display:flex;flex-direction:column;gap:10px}

.rp-bar{position:relative;height:10px;border-radius:99px;background:var(--sunken);overflow:hidden}
.rp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.rp-bar .b1{background:var(--accent)}
.rp-bar .b0{background:var(--ink);opacity:.35;z-index:1}
.present{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));opacity:0;transition:opacity .25s}
.present.on{opacity:1}
.present[hidden]{display:none!important}
.pr-top{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600}
.pr-top .pr-n{margin-left:auto;font-family:var(--f-mono)}
.pr-body{flex:1;overflow:auto;max-width:1100px;width:100%;margin:18px auto;font-size:15px;animation:rise .4s ease}
.pr-body h2{font-family:var(--f-display);font-size:34px;letter-spacing:-.02em;margin:0 0 18px}
.pr-body .rp-list li{font-size:15.5px;padding:12px 0}
.pr-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;width:100%;margin:0 auto}
.pr-dots{display:flex;gap:6px}.pr-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}.pr-dots i.on{background:var(--accent);width:22px;border-radius:99px}
@media (max-width:700px){.rp-pj{grid-template-columns:1fr auto}.rp-pj .rp-bar{grid-column:1/-1;order:3}.pr-body h2{font-size:24px}}

.acard-subs{display:flex;flex-direction:column;gap:4px}
.acs-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
/* ---------- table ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);max-height:calc(100dvh - 230px)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.sort{cursor:pointer}
.tbl th.sort:hover{color:var(--ink)}
.tbl th .arr{display:inline-block;margin-left:4px;color:var(--accent)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer;transition:background .15s}
.tbl tr.row:hover{background:var(--surface-2)}
.tbl tr.row.dim{opacity:.6}
.tbl .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.tbl .ttl{font-weight:600;max-width:300px}
.tbl .ttl div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcell{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.dcell .d{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.dcell .o{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dcell .o s{text-decoration-color:var(--muted)}
.exec{display:flex;flex-direction:column;gap:5px;min-width:120px}
.exec .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.exec .bar{height:4px}
.sub-st{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);max-width:180px;line-height:1.3}
.qa{display:flex;gap:6px;justify-content:flex-end}
.qa .btn{height:30px;font-size:12.5px;padding:0 10px}
.tbl .qa .btn{width:32px;padding:0;justify-content:center}
.tbl .qa .btn span{display:none}
.qa .btn.go{border-color:color-mix(in srgb,var(--st-done) 50%,transparent);color:var(--good-ink)}
.qa .btn.go:hover{background:color-mix(in srgb,var(--st-done) 10%,transparent)}

.cards{display:flex;flex-direction:column;gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.acard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acard .ttl{font-weight:650;font-size:15px}
.acard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.acard .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* ---------- gantt ---------- */
.g-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);max-height:calc(100dvh - 220px);position:relative}
.gantt{position:relative;--lw:270px}
.g-head{position:sticky;top:0;z-index:6;display:flex;background:var(--surface-2);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:7;width:var(--lw);flex:none;background:var(--surface-2);border-right:1px solid var(--line);padding:10px 14px;display:flex;align-items:flex-end;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.g-scale{position:relative;flex:none;height:52px}
.g-scale .m{position:absolute;top:0;height:26px;padding:6px 8px;font-size:12px;font-weight:650;border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden}
.g-scale .t{position:absolute;top:26px;height:26px;padding:3px 0 0 4px;line-height:1.1;font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap}
.g-scale .t.we{background:color-mix(in srgb,var(--sunken) 70%,transparent)}
.g-body{position:relative}
.g-lines{position:absolute;top:0;bottom:0;left:var(--lw);pointer-events:none}
.g-lines .v{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-lines .v.mo{border-left-color:var(--line-2)}
.g-lines .we{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:3}
.g-today span{position:sticky;top:56px;display:inline-block;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-top:4px;white-space:nowrap}
.g-row{display:flex;height:44px;border-bottom:1px solid var(--line);position:relative}
.g-row:hover .g-label,.g-row:hover .g-track{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.g-label{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:0 12px 0 14px;display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.g-label .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.g-label .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;font-size:13px;flex:1;min-width:0}
.g-track{position:relative;flex:none}
.g-grp{height:38px;background:var(--surface-2)}
.g-grp .g-label{background:var(--surface-2);font-weight:700;font-size:13px;cursor:default}
.g-grp .g-label .pct{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.g-sum{position:absolute;top:16px;height:6px;border-radius:3px;background:var(--c);opacity:.55;transform-origin:left}
.g-orig{position:absolute;top:7px;height:6px;border-radius:3px;background:var(--k-orig);opacity:.85}
.g-plan{position:absolute;top:15px;height:14px;border-radius:4px;background:var(--accent);transform-origin:left;cursor:pointer;transition:filter .15s}
.g-plan:hover{filter:brightness(1.08) saturate(1.1)}
.g-real{position:absolute;top:32px;height:6px;border-radius:3px;background:var(--ink);transform-origin:left}
.g-real.open{border-radius:3px 0 0 3px}
.g-real.open::after{content:"";position:absolute;right:-4px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.g-label .dot{width:9px;height:9px;flex:none}
.sgap{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink-2);margin:-6px 0 8px}
.sgap b{color:var(--ink)}.sgap b.neg{color:var(--bad-ink)}.sgap b.pos{color:var(--good-ink)}
.g-tag{position:absolute;top:13px;height:18px;display:flex;align-items:center;gap:5px;padding-left:6px;white-space:nowrap;font-size:11px;pointer-events:none}
.g-ms{position:absolute;top:13px;width:14px;height:14px;transform:rotate(45deg);background:var(--c);border-radius:2px;margin-left:-7px;margin-top:2px}

/* ---------- metas ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.mcard:hover{transform:translateY(-2px);box-shadow:0 18px 40px -24px rgba(0,0,0,.45)}
.mcard .hd{display:flex;gap:14px;align-items:center}
.mcard .ring{width:78px;height:78px;flex:none}
.mcard h3{margin:0 0 4px;font-family:var(--f-display);font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.mcard .meta-l{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12.5px;min-width:0}
.mcard .edit{position:absolute;top:12px;right:12px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.mstats div{display:flex;flex-direction:column}
.mstats b{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.mstats span{font-size:11.5px;color:var(--muted)}
.ring text{font-family:var(--f-body);font-weight:700;fill:var(--ink)}
.ringbg{stroke:var(--sunken)}
.ringfg{stroke:var(--c,var(--accent));stroke-linecap:round;transition:stroke-dasharray .6s}

/* ---------- pessoas ---------- */
.prow{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:7px 0}
.ptrack{display:flex;gap:2px;height:16px;transform-origin:left}
.ptrack i{display:block;height:100%;background:var(--c);min-width:3px;cursor:pointer;transition:filter .15s}
.ptrack i:first-child{border-radius:4px 0 0 4px}.ptrack i:last-child{border-radius:0 4px 4px 0}.ptrack i:only-child{border-radius:4px}
.ptrack i:hover{filter:brightness(1.12)}
.ptbl td,.ptbl th{white-space:nowrap}
table.ptbl{min-width:860px}

/* ---------- replanejamentos ---------- */
.rgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.rgrid > *{grid-column:span 12}
.rk{grid-column:span 12;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;overflow:hidden}
.rk .kpi{border-bottom:0}
.rk .kpi:nth-child(3n){border-right:1px solid var(--line)}
.rk .kpi:last-child{border-right:0}
.r-half{grid-column:span 6}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:12px;align-items:center;font-size:13px}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hb .b{height:14px;border-radius:0 4px 4px 0;background:var(--c,var(--accent));transform-origin:left;min-width:3px}
.hb .v{font-family:var(--f-mono);font-size:12px;font-weight:600;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;border-left:1.5px dashed var(--line-2)}
.tl li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:10px 0}
.tl .mk{width:32px;height:32px;display:grid;place-items:center;background:var(--surface);position:relative;z-index:1}
.tl .mk svg{width:28px;height:28px}
.tl .mk svg path{fill:color-mix(in srgb,var(--st-risk) 30%,var(--surface));stroke:var(--ink);stroke-width:1.4}
.tl .mk svg text{font-family:var(--f-mono);font-size:9.5px;font-weight:700;fill:var(--ink)}
.tl .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .hd b{font-weight:650}
.tl .ch{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.tl .why{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.tl .why .mot{font-weight:650;color:var(--ink);margin-right:6px}
.tl .when{font-weight:500;color:var(--muted)}
.tl li.grp{display:block;font-family:var(--f-display);font-weight:650;font-size:14px;padding:14px 0 2px 44px;color:var(--ink-2)}

/* ---------- drawer & modal ---------- */
.overlay{position:fixed;inset:0;z-index:60}
.overlay[hidden]{display:none!important}
.scrim{position:absolute;inset:0;background:rgba(8,10,16,.42);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.overlay.open .scrim{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.overlay.open .drawer{transform:none}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dr-h .r1{display:flex;align-items:center;gap:10px}
.dr-h .r1 .sp{flex:1}
.dr-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.dr-b{flex:1;overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:20px}
.dr-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface)}
.dr-f .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.f > .lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f .req{color:var(--bad-ink)}
.f .inp,.f .sel{width:100%;max-width:none}
textarea.inp{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.45}
.f .hint{font-size:12px;color:var(--muted)}
.withbtn{display:flex;gap:6px}
.withbtn .inp{flex:1}
fieldset.box{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:flex;flex-direction:column;gap:12px}
fieldset.box legend{padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.planhint{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.planhint.changed{background:color-mix(in srgb,var(--st-risk) 16%,var(--surface));color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vbox{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.vbox span{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.vbox b{font-family:var(--f-mono);font-size:15px;font-weight:650}
.vbox b.up{color:var(--bad-ink)}.vbox b.dn{color:var(--good-ink)}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);font-weight:600;width:44px;text-align:right}
.err{color:var(--bad-ink);font-size:12.5px;font-weight:550;margin:0}
.err:empty{display:none}
.modal{position:absolute;left:50%;top:50%;width:min(520px,calc(100% - 32px));max-height:calc(100dvh - 40px);overflow:auto;transform:translate(-50%,-46%) scale(.96);opacity:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;display:flex;flex-direction:column}
.modal.wide{width:min(860px,calc(100% - 32px))}
.overlay.open .modal{transform:translate(-50%,-50%);opacity:1}
.md-h{padding:18px 22px 6px}
.md-h h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.01em}
.md-h p{margin:6px 0 0;color:var(--muted)}
.md-b{padding:14px 22px;display:flex;flex-direction:column;gap:14px}
.md-f{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.revcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.revcard .rh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:650}
.revcard .rh svg{width:26px;height:26px}
.revcard .rh svg path{fill:color-mix(in srgb,var(--st-risk) 35%,var(--surface));stroke:var(--ink);stroke-width:1.4}
.revcard .rh svg text{font-family:var(--f-mono);font-size:9.5px;font-weight:700;fill:var(--ink)}
.revcard table{width:100%;border-collapse:collapse;font-size:13px}
.revcard td,.revcard th{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.revcard th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.revcard tr:last-child td{border-bottom:0}
.revcard .mono{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;font-weight:550;cursor:pointer;transition:all .15s;color:var(--ink-2)}
.chips label:hover{border-color:var(--ink-2)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:9px;background:var(--c);cursor:pointer;display:grid;place-items:center;transition:transform .15s;position:relative}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swatches label:hover{transform:scale(1.08)}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:30px;height:30px;color:var(--accent)}
.drop input{position:absolute;opacity:0;pointer-events:none;width:1px}
.maptbl{width:100%;border-collapse:collapse;font-size:13px}
.maptbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.maptbl td:first-child{width:46%;font-weight:550;padding-right:12px}
.maptbl .sel{width:100%;max-width:none;height:32px}
.prev{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:220px}
.prev table{border-collapse:collapse;font-size:12px;min-width:100%}
.prev th,.prev td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.prev th{background:var(--surface-2);font-size:11px;color:var(--muted);position:sticky;top:0}
.prev td.bad{color:var(--bad-ink);font-weight:600}
.pbar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- tooltip, toast, confetti ---------- */
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--rail);color:#eef1f8;border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:280px;line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .th{color:#9aa3bb;font-size:11px;margin-bottom:4px;font-weight:600}
.tip .tr{display:flex;align-items:center;gap:8px}
.tip .tr i{display:inline-block;width:12px;border-top:2px solid var(--c)}
.tip .tr i.dash{border-top-style:dashed}

  <h3>Os dados não puderam ser carregados</h3><p>Abra esta página pelo claude.ai, com sua conta conectada, para ver e salvar as atividades.</p></div>`;
}
function meetBanner() {
  if (S.state !== 'ready' || !S.canWrite || !S.atividades.length || S.view === 'reuniao') return '';
  const last = meetings()[0], age = last ? today() - P(last.data) : null;
  if (age != null && age <= 7) return '';
  return `<div class="banner" style="margin-top:8px">${ic('flag')}<span>${last ? `A última reunião foi fechada há <b>${age} dias</b> (${fds(P(last.data))}).` : 'Nenhuma reunião fechada ainda.'} Feche a reunião ao final de cada encontro para comparar a próxima com precisão.</span><span class="sp"></span><a class="btn sm" href="#${projHash('reuniao')}">Abrir reunião</a></div>`;
}
function renderBanner() {
  const ex = S.state === 'ready' && [...S.atividades, ...S.metas, ...S.pessoas].some(d => d.exemplo);

function emptyHome() {

/* ===================== PAINEL ===================== */
function vPainel() {
  const L = live(acts());
  if (!L.length) return emptyAll();
  const total = L.length, by = {}; ST_KEYS.forEach(k => by[k] = 0); acts().forEach(x => by[x.c.status]++);
  const concl = L.filter(x => x.c.done), noPrazo = by.concluida;
  const ader = concl.length ? noPrazo / concl.length * 100 : 0; // das entregas finalizadas, quantas saíram até o fim planejado atual
  const noBase = concl.filter(x => x.c.statusOrig === 'concluida').length;
  const W = L.reduce((s, x) => s + (+x.a.peso || 1), 0);
  const prog = W ? L.reduce((s, x) => s + (+x.a.peso || 1) * x.c.valor, 0) / W * 100 : 0;
  const rep = L.filter(x => x.c.replan);
  const desvMed = rep.length ? rep.reduce((s, x) => s + x.c.dFim, 0) / rep.length : 0;
  const lateN = by.atrasada + by.inicio_atrasado;
  const T = today();

  const hero = `<div class="card hero rise" style="--i:0">
    ${ringSVG(concl.length ? ader : 0, 'hero')}
    <div><div class="eyebrow">Entregas no prazo</div>
    <div class="big">${concl.length ? cnum('ader', ader, 'pct') : '—'}</div>
    ${concl.length ? `<p class="hero-l"><b>${noPrazo} de ${concl.length}</b> ${concl.length === 1 ? 'atividade finalizada saiu' : 'atividades finalizadas saíram'} no prazo</p>
    <ul class="hero-b">
      <li><i style="--c:var(--st-donelate)"></i><span><b>${concl.length - noPrazo}</b> ${concl.length - noPrazo === 1 ? 'finalizada' : 'finalizadas'} com atraso</span></li>
      ${concl.length ? `<li><i style="--c:#9aa3bb"></i><span><b>${noBase}</b> de ${concl.length} dentro da data original</span></li>` : ''}
      ${by.atrasada ? `<li><i style="--c:var(--st-late)"></i><span>Atenção: <b>${by.atrasada}</b> ${by.atrasada === 1 ? 'já venceu e segue' : 'já venceram e seguem'} em aberto</span></li>` : ''}
    </ul>` : '<p>Aparece quando a primeira atividade for finalizada</p>'}</div></div>`;

  const kpi = (i, lbl, icon, c, val, foot, act = '') => `<div class="kpi rise ${act ? 'click' : ''}" style="--i:${i};--c:${c}" ${act} ${act ? 'tabindex="0"' : ''}>
    <div class="lbl">${ic(icon)}${lbl}</div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;
  const kpis = `<div class="card kpis">
    ${kpi(1, 'Progresso geral', 'trend', 'var(--accent)', cnum('prog', prog, 'pct'), `${concl.length} de ${total} concluídas`)}
    ${kpi(2, 'Em andamento', 's_play', stColor('andamento'), cnum('run', by.andamento), `${by.nao_iniciada} ainda não iniciadas`, 'data-act="st-go" data-k="andamento"')}
    ${kpi(3, 'Em risco', 's_alert', stColor('risco'), cnum('risk', by.risco), `vencem em até ${S.cfg.diasRisco} ${S.cfg.diasRisco === 1 ? 'dia' : 'dias'} sem avanço suficiente, ou com avanço baixo`, 'data-act="st-go" data-k="risco"')}
    ${kpi(4, 'Atrasadas', 's_late', stColor('atrasada'), cnum('late', lateN), `${by.atrasada} no fim · ${by.inicio_atrasado} no início`, 'data-act="st-go" data-k="atrasada,inicio_atrasado"')}
    ${kpi(5, 'Replanejadas', 'rev', 'var(--st-risk)', cnum('rep', rep.length), `${total ? Math.round(rep.length / total * 100) : 0}% das atividades`, 'data-act="go" data-v="replanejamentos"')}
    ${kpi(6, 'Desvio médio do fim', 'flag', desvMed > 0 ? stColor('atrasada') : 'var(--muted)', rep.length ? cnum('desv', desvMed, 'sd') : '—', 'entre as replanejadas, vs. data original')}
  </div>`;

  // donut
  const parts = ST_KEYS.filter(k => by[k]).map(k => ({ k, v: by[k] }));
  const all = acts().length;
  const donut = `<div class="card c-donut rise" style="--i:2"><div class="card-h"><h2>Situação das atividades</h2><span class="sub">clique para filtrar</span></div>
    <div class="donut-wrap">${donutSVG(parts, all)}
    <ul class="legend">${parts.map(p => `<li data-act="st-go" data-k="${p.k}" tabindex="0"><span class="sw" style="--c:${stColor(p.k)}"></span><span>${ST[p.k].l}</span><span class="n">${p.v}</span><span class="p">${Math.round(p.v / all * 100)}%</span></li>`).join('')}</ul></div></div>`;

  const scurve = `<div class="card c-scurve rise" style="--i:3"><div class="card-h"><h2>Curva S · conclusões acumuladas</h2>
    <div class="lkeys"><span><i style="--c:var(--k-orig)"></i>Plano original</span><span><i style="--c:var(--accent)"></i>Plano atual</span><span><i style="--c:var(--ink)"></i>Realizado</span></div></div>
    <div class="sgap" id="sgap"></div><div class="chart" id="scurve" style="height:250px"></div></div>`;

  const prox = live(acts()).filter(x => !x.c.done && x.a.manual !== 'pausada' && x.c.fp >= T && x.c.fp <= T + 14).sort((a, b) => a.c.fp - b.c.fp).slice(0, 6);
  const proxHTML = `<div class="card c-list rise" style="--i:4"><div class="card-h"><h2>Próximas entregas</h2><span class="sub">14 dias · plano atual</span></div>
    ${prox.length ? `<ul class="ilist">${prox.map(x => { const n = x.c.fp - T; return `<li data-act="open-act" data-id="${x.a.id}" tabindex="0">
      <div class="cal ${n <= 1 ? 'hot' : ''}"><small>${MES[Dt(x.c.fp).getUTCMonth()]}</small><b>${Dt(x.c.fp).getUTCDate()}</b></div>
      <div style="min-width:0"><div class="t">${esc(x.a.titulo)}</div><div class="s">${avatar(x.p, 'sm')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.p ? esc(x.p.nome) : 'Sem responsável'}</span>${revMark(x.c.nRep)}</div></div>
      <span class="when ${n <= 1 ? 'hot' : ''}">${n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias'}</span></li>`; }).join('')}</ul>` : `<p class="muted">Nada vencendo nos próximos 14 dias.</p>`}</div>`;

  const att = acts().filter(x => ['atrasada', 'inicio_atrasado', 'risco'].includes(x.c.status)).sort((a, b) => ST[a.c.status].o - ST[b.c.status].o || (a.c.rest ?? 0) - (b.c.rest ?? 0)).slice(0, 6);
  const attHTML = `<div class="card c-list rise" style="--i:5"><div class="card-h"><h2>Pede atenção agora</h2><span class="sub">vs. plano atual</span></div>
    ${att.length ? `<ul class="ilist">${att.map(x => {
      const ref = x.c.status === 'inicio_atrasado' ? dd(x.c.ip, T) : -(x.c.rest ?? 0);
      const txt = x.c.status === 'risco' ? (x.c.rest === 0 ? 'vence hoje' : `faltam ${x.c.rest} ${U()}`) : x.c.status === 'inicio_atrasado' ? `início há ${ref} ${U()}` : `${ref} ${U()} de atraso`;
      return `<li class="att" data-act="open-act" data-id="${x.a.id}" tabindex="0"><div style="min-width:0"><div class="t t2">${esc(x.a.titulo)}</div><div class="s">${chip(x.c.status, 'sm')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.a.codigo || '')} · ${x.p ? esc(x.p.nome) : 'Sem responsável'}</span></div></div><span class="when ${x.c.status !== 'risco' ? 'hot' : ''}">${txt}</span></li>`; }).join('')}</ul>`
      : `<p class="muted">Nenhuma atividade atrasada ou em risco. Bom trabalho.</p>`}</div>`;

  const ps = [...S.pessoas].map(p => { const xs = live(acts()).filter(x => x.a.respId === p.id); const W = xs.reduce((s, x) => s + (+x.a.peso || 1), 0); return { p, n: xs.length, prog: W ? xs.reduce((s, x) => s + (+x.a.peso || 1) * x.c.valor, 0) / W * 100 : 0 }; }).filter(o => o.n).sort((a, b) => b.n - a.n);
  const metasHTML = `<div class="card c-list wide rise" style="--i:6"><div class="card-h"><h2>Responsáveis</h2><a class="sub" href="#${projHash('responsaveis')}">ver todos</a></div>
    ${ps.length ? `<div class="mini-m">${ps.slice(0, 8).map((o, i) => `<div class="r" data-act="open-resp" data-id="${o.p.id}" tabindex="0" style="--c:var(--accent)">
      <span class="who" style="font-weight:550;font-size:13px">${avatar(o.p, 'sm')}<span>${esc(o.p.nome)} <span class="muted" style="font-weight:400">· ${o.n} ${o.n === 1 ? 'atividade' : 'atividades'}</span></span></span>
      <b class="tnum">${cnum('pp' + o.p.id, o.prog, 'pct')}</b>
      <div class="bar"><i class="grow" style="--i:${i};width:${o.prog.toFixed(1)}%"></i></div></div>`).join('')}</div>` : `<p class="muted">Nenhuma atividade com responsável ainda.</p>`}</div>`;

  const egs = S.proj ? etapaGroups(acts(), S.proj, true) : [];
  const etHTML = egs.length && etapasOf(S.proj).length ? `<div class="card rise" style="--i:6;grid-column:span 12"><div class="card-h"><h2>Etapas</h2><span class="sub">clique para ver as atividades da etapa</span></div>
    <div class="etiles">${egs.map((g, i) => { const st = groupStats(g.xs); return `<div class="etile" data-act="open-etapa" data-e="${g.e ? g.e.id : '_none'}" tabindex="0">
      <div class="et-top">${etBadge(g.n)}<b>${g.e ? esc(g.e.nome) : 'Sem etapa'}</b></div>
      <div class="et-mid"><span class="big tnum">${cnum('et' + g.key, st.prog, 'pct')}</span><span class="muted">${st.n ? `${fds(st.ini)} → ${fds(st.fim)}` : 'sem atividades'}</span></div>
      <div class="bar"><i class="grow" style="--i:${i};width:${st.prog.toFixed(1)}%"></i></div>
      <div class="et-ft"><span>${st.done}/${live(g.xs).length} concluídas</span>${st.late ? `<span class="st s-late sm">${ic('s_late')}<span>${st.late}</span></span>` : ''}${st.risk ? `<span class="st s-risk sm">${ic('s_alert')}<span>${st.risk}</span></span>` : ''}</div></div>`; }).join('')}</div></div>` : '';
  return `<div class="dash">${hero}${kpis}${finPainelCard()}${donut}${scurve}${etHTML}${proxHTML}${attHTML}${metasHTML}</div>`;
}
function afterPainel(host) { const el = $('#scurve', host); if (el) drawSCurve(el, live(acts())); finAfterPainel(); }

function ringSVG(p, kind, c) {
  const v = Math.max(0, Math.min(100, p));
  const sw = kind === 'hero' ? 10 : 8;
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true" ${c ? `style="--c:${c}"` : ''}>
    <circle class="ringbg" cx="50" cy="50" r="42" fill="none" stroke-width="${sw}"/>
    <circle class="ringfg" cx="50" cy="50" r="42" fill="none" stroke-width="${sw}" pathLength="100" stroke-dasharray="${v.toFixed(2)} 100" transform="rotate(-90 50 50)"/>
    ${kind === 'hero' ? '' : `<text x="50" y="57" text-anchor="middle" font-size="22">${Math.round(v)}%</text>`}</svg>`;
}
function donutSVG(parts, total) {
  const R = 80, C = 2 * Math.PI * R; let off = 0;
  const segs = parts.map(p => {
    const len = p.v / total * C, gap = parts.length > 1 ? 2 : 0;
    const s = `<circle class="seg" tabindex="0" cx="100" cy="100" r="${R}" fill="none" stroke="${stColor(p.k)}" stroke-width="22" stroke-dasharray="${Math.max(0.5, len - gap).toFixed(2)} ${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)" data-act="st-go" data-k="${p.k}" data-tipv="${p.v}" data-tipl="${ST[p.k].l} · ${Math.round(p.v / total * 100)}%"/>`;
    off += len; return s;
  }).join('');
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Distribuição por situação">
    ${segs}<circle class="donut-cover" cx="100" cy="100" r="${R}" fill="none" stroke="var(--surface)" stroke-width="28" stroke-dasharray="${C.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-C).toFixed(2)}" style="--C:${(-C).toFixed(2)}" transform="rotate(-90 100 100)" pointer-events="none"/>
    <text x="100" y="98" text-anchor="middle" style="font-size:40px;font-weight:700;fill:var(--ink);letter-spacing:-1px">${total}</text>
    <text x="100" y="122" text-anchor="middle" style="font-size:13px;fill:var(--muted)">atividades</text></svg>`;
}

function drawSCurve(host, L) {
  const T = today(), N = L.length;
  if (!N) { host.innerHTML = '<p class="muted">Sem dados.</p>'; return; }
  let lo = Infinity, hi = -Infinity;
  L.forEach(x => { lo = Math.min(lo, x.c.io, x.c.ip, x.c.ir ?? Infinity); hi = Math.max(hi, x.c.fo, x.c.fp, x.c.fr ?? -Infinity); });
  lo = Math.min(lo, T) - 1; hi = Math.max(hi, T) + 1;
  const ub = arr => { arr.sort((a, b) => a - b); return d => { let l = 0, h = arr.length; while (l < h) { const m = (l + h) >> 1; if (arr[m] <= d) l = m + 1; else h = m; } return l; }; };
  const fB = ub(L.map(x => x.c.fo)), fP = ub(L.map(x => x.c.fp)), fR = ub(L.filter(x => x.c.fr != null).map(x => x.c.fr));
  const Wd = host.clientWidth || 600, H = 250, m = { l: 40, r: 70, t: 12, b: 26 };
  const iw = Wd - m.l - m.r, ih = H - m.t - m.b;
  const X = d => m.l + (d - lo) / (hi - lo) * iw, Y = v => m.t + ih - v * ih;
  const path = (f, upto) => { let s = ''; for (let d = lo; d <= (upto ?? hi); d++) s += (s ? 'L' : 'M') + X(d).toFixed(1) + ',' + Y(f(d) / N).toFixed(1); return s; };
  const yT = [0, .25, .5, .75, 1];
  let xT = [];
  const span = hi - lo;
  if (span <= 50) { for (let d = lo; d <= hi; d++) if (wd(d) === 1) xT.push({ d, l: fds(d) }); }
  else { for (let d = lo; d <= hi; d++) { const dt = Dt(d); if (dt.getUTCDate() === 1) xT.push({ d, l: MES[dt.getUTCMonth()] + (dt.getUTCMonth() === 0 ? ' ' + dt.getUTCFullYear() : '') }); } }
  if (span > 300) xT = xT.filter((_, i) => i % 2 === 0);
  const rNow = fR(T) / N, pNow = fP(T) / N, bNow = fB(T) / N;
  const gapEl = document.getElementById('sgap');
  if (gapEl) { const pp = v => Math.round(v * 100), gp = pp(rNow) - pp(pNow), gb = pp(rNow) - pp(bNow);
    const g = v => `<b class="${v < 0 ? 'neg' : v > 0 ? 'pos' : ''}">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)} p.p.</b>`;
    gapEl.innerHTML = `<span>Hoje deveriam estar concluídas <b>${pp(pNow)}%</b> pelo plano atual e <b>${pp(bNow)}%</b> pelo plano original. Realizado: <b>${pp(rNow)}%</b>.</span><span>Diferença vs. plano atual ${g(gp)} · vs. plano original ${g(gb)}</span>`; }
  host.innerHTML = `<svg width="${Wd}" height="${H}" role="img" aria-label="Curva S: plano original ${Math.round(bNow * 100)}%, plano atual ${Math.round(pNow * 100)}%, realizado ${Math.round(rNow * 100)}% até hoje">
    <g class="grid">${yT.map(v => `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
    <g class="axis">${yT.map(v => `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v * 100}%</text>`).join('')}
    ${xT.map(t => `<text x="${X(t.d)}" y="${H - 6}" text-anchor="middle">${t.l}</text>`).join('')}</g>
    <line x1="${X(T)}" x2="${X(T)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--accent)" stroke-width="1" opacity=".55"/>
    <text x="${X(T)}" y="${m.t + 10}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:var(--accent);paint-order:stroke;stroke:var(--surface);stroke-width:4px">Hoje</text>
    <path class="draw" pathLength="1" stroke-dasharray="1" d="${path(fB)}" fill="none" stroke="var(--k-orig)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="draw" pathLength="1" stroke-dasharray="1" d="${path(fP)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${path(fR, T)}L${X(T).toFixed(1)},${Y(0)}L${X(lo).toFixed(1)},${Y(0)}Z" fill="var(--ink)" fill-opacity=".07" class="fadein"/>
    <path class="draw" pathLength="1" stroke-dasharray="1" d="${path(fR, T)}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(T)}" cy="${Y(rNow)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(T) > Wd - 120 ? X(T) - 9 : X(T) + 9}" y="${Y(rNow) + 4}" text-anchor="${X(T) > Wd - 120 ? 'end' : 'start'}" style="font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px">${Math.round(rNow * 100)}% realizado</text>
    <g id="sx" style="display:none"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink-2)" stroke-width="1"/><circle r="4" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/><circle r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/></g>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="shit"/></svg>`;
  const svg = host.querySelector('svg'), g = $('#sx', svg), hit = $('#shit', svg), tip = $('#tip');
  const move = e => {
    const r = svg.getBoundingClientRect(); const px = e.clientX - r.left;
    const d = Math.max(lo, Math.min(hi, Math.round(lo + (px - m.l) / iw * (hi - lo))));
    const b = fB(d) / N, p = fP(d) / N, rr = d <= T ? fR(d) / N : null;
    g.style.display = ''; const x = X(d);
    g.children[0].setAttribute('x1', x); g.children[0].setAttribute('x2', x);
    [[1, b], [2, p], [3, rr]].forEach(([i, v]) => { const c = g.children[i]; if (v == null) c.style.display = 'none'; else { c.style.display = ''; c.setAttribute('cx', x); c.setAttribute('cy', Y(v)); } });
    showTip(e.clientX, e.clientY, `<div class="th">${fd(d)}${d === T ? ' · hoje' : ''}</div>
      <div class="tr"><i style="--c:#9aa3bb"></i><b>${Math.round(b * 100)}%</b><span>Plano original (${fB(d)})</span></div>
      <div class="tr"><i style="--c:#9fb2ff"></i><b>${Math.round(p * 100)}%</b><span>Plano atual (${fP(d)})</span></div>
      ${rr != null ? `<div class="tr"><i style="--c:#fff"></i><b>${Math.round(rr * 100)}%</b><span>Realizado (${fR(d)})</span></div>` : ''}`);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { g.style.display = 'none'; hideTip(); });
}

/* ===================== ATIVIDADES ===================== */
function filtered(L) {
  const f = S.f, q = norm(f.q);
  return L.filter(x =>

function vCronograma() {

  const T = today();
  const gHasEt = S.proj && etapasOf(S.proj).length;
  const toolbar = `<div class="toolbar rise">
    <div class="seg-ctl" role="group" aria-label="Escala">${[['semana', 'Semana'], ['mes', 'Mês'], ['tri', 'Trimestre']].map(([k, l]) => `<button data-act="zoom" data-z="${k}" class="${S.zoom === k ? 'on' : ''}" aria-pressed="${S.zoom === k}">${l}</button>`).join('')}</div>
    ${gHasEt ? `<button class="btn ghost sm" data-act="exp-all">Expandir etapas</button><button class="btn ghost sm" data-act="col-all">Recolher etapas</button>` : ''}${L.some(x => x.c.subs) ? `<button class="btn ghost sm" data-act="sub-exp-all">Expandir etapas</button><button class="btn ghost sm" data-act="sub-col-all">Recolher etapas</button>` : ''}
    <div class="lkeys" style="margin-left:auto"><span><i class="solid" style="--c:var(--k-orig);height:5px"></i>Plano original</span><span><i class="solid" style="--c:var(--accent)"></i>Plano atual</span><span><i class="solid" style="--c:var(--ink);height:5px"></i>Execução real</span><span><i class="dot" style="--c:var(--st-late)"></i>Situação</span><span><i style="--c:var(--accent);border-top-width:2px;width:2px;height:12px;border-top:0;border-left:2px solid var(--accent)"></i>Hoje</span></div></div>`;
  if (!L.length) return toolbar + `<div class="card empty"><h3>Sem atividades neste projeto</h3></div>`;
  let lo = Infinity, hi = -Infinity;
  L.forEach(x => { lo = Math.min(lo, x.c.io, x.c.ip, x.c.ir ?? Infinity); hi = Math.max(hi, x.c.fo, x.c.fp, x.c.fr ?? -Infinity); });
  lo = Math.min(lo, T) - 3; hi = Math.max(hi, T) + 12;
  while (wd(lo) !== 1) lo--;
  const px = { semana: 30, mes: 13, tri: 4.5 }[S.zoom];
  const days = hi - lo + 1, W = Math.ceil(days * px);
  const X = n => (n - lo) * px, Wd = (a, b) => Math.max(px * 0.6, (b - a + 1) * px);
  // escala
  let months = '', ticks = '', lines = '';
  for (let d = lo; d <= hi; d++) {
    const dt = Dt(d);
    if (dt.getUTCDate() === 1 || d === lo) {
      let e = d; while (e <= hi && (e === d || Dt(e).getUTCDate() !== 1)) e++;
      months += `<div class="m" style="left:${X(d)}px;width:${(e - d) * px}px">${MESL[dt.getUTCMonth()]}${dt.getUTCMonth() === 0 || d === lo ? ' ' + dt.getUTCFullYear() : ''}</div>`;
      if (dt.getUTCDate() === 1) lines += `<div class="v mo" style="left:${X(d)}px"></div>`;
    }
    if (S.zoom === 'semana') {
      ticks += `<div class="t ${isWd(d) ? '' : 'we'}" style="left:${X(d)}px;width:${px}px">${dt.getUTCDate()}<br>${DOW[wd(d)]}</div>`;
      if (wd(d) === 6) lines += `<div class="we" style="left:${X(d)}px;width:${px * 2}px"></div>`;
    } else if (wd(d) === 1) {
      if (S.zoom === 'mes') ticks += `<div class="t" style="left:${X(d)}px;width:${px * 7}px">${fds(d)}</div>`;
      lines += `<div class="v" style="left:${X(d)}px"></div>`;
    }
  }
  // grupos
  const groups = gHasEt ? etapaGroups(L, S.proj, false) : [{ e: null, n: 0, key: (S.proj || 'all') + ':*', xs: L, label: S.proj ? projName(S.proj) : 'Atividades' }];
  let rowsHTML = '', ri = 0;
  groups.forEach(g => {
    g.xs.sort((a, b) => a.c.ip - b.c.ip || a.c.fp - b.c.fp);
    const st = groupStats(g.xs), open = !S.col.has(g.key);
    const pi = st.ini, pf = Math.max(...g.xs.map(x => x.c.fp));
    const gname = g.label ? esc(g.label) : g.e ? esc(g.e.nome) : 'Sem etapa';
    rowsHTML += `<div class="g-row g-grp ${open ? '' : 'closed'}"><div class="g-label" data-act="tog-et" data-k="${g.key}" tabindex="0" aria-expanded="${open}"><span class="chev ${open ? 'open' : ''}">${ic('chev')}</span>${etBadge(g.n)}<span class="nm">${gname}</span><span class="pct">${Math.round(st.prog)}%</span></div>
      <div class="g-track" style="width:${W}px"><div class="g-orig" style="left:${X(st.iniO)}px;width:${Wd(st.iniO, st.fimO)}px;top:8px;height:4px"></div><div class="g-sum grow" data-tip="${gname}
Plano atual: ${fds(pi)} → ${fds(pf)}
Plano original: ${fds(st.iniO)} → ${fds(st.fimO)}
${st.n} atividades · ${Math.round(st.prog)}% concluído${st.late ? ' · ' + st.late + ' atrasadas' : ''}" style="left:${X(pi)}px;width:${Wd(pi, pf)}px"><i style="width:${st.prog.toFixed(1)}%"></i></div>${!open ? `<span class="g-cnt" style="left:${X(pf) + Wd(pf, pf) + 6}px">${st.n} ${st.n === 1 ? 'atividade' : 'atividades'}${st.late ? ` · <b class="neg">${st.late} atrasada${st.late > 1 ? 's' : ''}</b>` : ''}</span>` : ''}</div></div>`;
    if (!open) return;
    g.xs.forEach(x => {
      const c = x.c, col = stColor(c.status), i = Math.min(ri++, 20);
      const tip = `${esc(x.a.codigo || '')} · ${esc(x.a.titulo)}\nPlano atual: ${fds(c.ip)} → ${fds(c.fp)}${c.replan ? `\nOriginal: ${fds(c.io)} → ${fds(c.fo)} (fim ${fdelta(c.dFim)})` : ''}${c.ir != null ? `\nReal: ${fds(c.ir)} → ${c.fr != null ? fds(c.fr) : 'em curso'}` : ''}\n${ST[c.status].l}`;
      const tagX = Math.max(X(c.fp) + Wd(c.fp, c.fp), c.replan ? X(c.fo) + Wd(c.fo, c.fo) : 0, c.fr != null ? X(c.fr) + px : 0);
      const realEnd = c.fr ?? Math.max(c.ir ?? T, T);
      rowsHTML += `<div class="g-row"><div class="g-label" data-act="open-act" data-id="${x.a.id}" tabindex="0">${subToggle(x)}<span class="code">${esc(x.a.codigo || '')}</span><i class="dot" style="--c:${col}" data-tip="${ST[c.status].l}"></i><span class="nm">${esc(x.a.titulo)}</span>${c.subs ? subCount(x) : ''}${avatar(x.p, 'sm')}</div>
        <div class="g-track" style="width:${W}px">

          <div class="g-plan grow" style="--i:${i};left:${X(c.ip)}px;width:${Wd(c.ip, c.fp)}px;${c.canc ? 'opacity:.4' : ''}" data-act="open-act" data-id="${x.a.id}" data-tip="${tip}">${c.subs ? `<i class="gp-fill" style="width:${Math.round(c.prog || 0)}%"></i>` : ''}</div>
          ${c.ir != null ? `<div class="g-real grow ${c.fr == null ? 'open' : ''}" style="--i:${i};left:${X(c.ir)}px;width:${Wd(c.ir, realEnd)}px"></div>` : ''}
          <div class="g-tag" style="left:${tagX + 2}px">${c.replan ? revMark(c.nRep) + dlt(c.dFim, false) : ''}${c.status === 'atrasada' ? `<span class="dl up">${fdelta(dd(c.fp, T))} atraso</span>` : ''}</div>

const fmtPP = v => { const r = Math.round(v * 10) / 10; return (r > 0 ? '+' : r < 0 ? '−' : '') + num(Math.abs(r), Math.abs(r) % 1 ? 1 : 0) + ' p.p.'; };
const fmtDias = v => { const r = Math.round(Math.abs(v) * 10) / 10; return num(r, r % 1 ? 1 : 0) + (r === 1 ? ' dia' : ' dias'); };
function shares(a) {
  const L = live(allActs()).filter(y => (y.a.metaId || '') === (a.metaId || ''));
  const et = L.filter(y => (y.a.etapaId || '') === (a.etapaId || ''));
  const w = +a.peso || 1, sw = arr => arr.reduce((s, y) => s + (+y.a.peso || 1), 0);
  return { et: w / (sw(et) || w), proj: w / (sw(L) || w) };
}
function dayState(v) { return v == null ? '' : v >= 100 ? 'feito' : v <= 0 ? 'nao' : 'parcial'; }
function projDay(L, D) {
  let W = 0, R = 0, Pp = 0;
  live(L).forEach(x => {
    const w = +x.a.peso || 1, c = x.c; W += w;
    if (c.di && c.di.on) { R += w * c.di.realAt(D); }
    else R += w * (c.fr != null && c.fr <= D ? 100 : (x.a.progresso ?? 0));
    Pp += w * (c.di ? c.di.plannedAt(D) : expected(c.ip, c.fp, D));
  });
  return W ? { real: R / W, plan: Pp / W } : { real: 0, plan: 0 };
}

const findAct = id => S.atividades.find(x => x.id === id) || null;
function actPatchFromSubs(a, subs) {
  // as etapas preenchem início/fim real da atividade quando ela não tem data própria
  const p = { etapas: subs, atualizadoEm: nowISO() };
  const irs = subs.map(s => s.iniReal).filter(Boolean).sort(), frs = subs.map(s => s.fimReal);
  if (!a.iniReal && irs.length) { p.iniReal = irs[0]; p.iniAuto = true; }
  if (a.iniAuto && !irs.length) { p.iniReal = ''; p.iniAuto = false; }
  const allDone = subs.length && frs.every(Boolean);
  if (allDone && !a.fimReal) { p.fimReal = frs.slice().sort().pop(); p.fimAuto = true; }
  if (!allDone && a.fimAuto && a.fimReal) { p.fimReal = ''; p.fimAuto = false; }
  return p;
}
